name: Publicar Explorador U-Pb no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obter código
        uses: actions/checkout@v6
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Atualizar pacote de código-fonte
        run: python3 scripts/package-source.py
      - name: Preparar arquivos estáticos
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
